# Render Blueprint: the Express API. (The React storefront is hosted on Vercel.)
services:
  - type: web
    name: shopnest-api
    runtime: node
    region: singapore
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true # Render creates a random secret
      # Entered in the Render dashboard, never stored in the repo:
      - key: MONGO_URI
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: CLIENT_URL
        sync: false
